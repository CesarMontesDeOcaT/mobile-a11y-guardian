name: Push Listener & Alerta

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  create-push-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository code
        uses: actions/checkout@v5

      - name: Create Issue "Push detected"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Push detected: ${GITHUB_REF_NAME}" \
            --body "A push was detected in commit \`${GITHUB_SHA:0:7}\` by @${GITHUB_ACTOR}."